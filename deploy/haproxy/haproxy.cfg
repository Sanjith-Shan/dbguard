# DBGuard write endpoint. HAProxy never decides anything: the one node whose dbguard-agent
# answers 200 on GET /primary (port 8080) gets the traffic. See docs/INTERFACES.md.
global
    log stdout format raw local0 info
    maxconn 4096

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 500ms
    timeout retry 500ms
    hold valid 1s
    hold other 1s
    hold refused 1s
    hold nx 1s
    hold timeout 1s
    hold obsolete 1s

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 2s
    # Long client/server timeouts: a semi-sync stall legitimately blocks a commit for as long
    # as no replica acknowledges, and the workload measures that stall.
    timeout client 1h
    timeout server 1h
    timeout check 1s
    # Spares (a4/b4) are not running by default. Resolve lazily and never refuse to start.
    default-server init-addr last,libc,none resolvers docker check port 8080 inter 500ms fall 1 rise 1 on-marked-down shutdown-sessions

frontend rs1_write
    bind :3306
    default_backend rs1

frontend rs2_write
    bind :3307
    default_backend rs2

backend rs1
    option httpchk GET /primary
    http-check expect status 200
    server mysql-a1 mysql-a1:3306
    server mysql-a2 mysql-a2:3306
    server mysql-a3 mysql-a3:3306
    server mysql-a4 mysql-a4:3306

backend rs2
    option httpchk GET /primary
    http-check expect status 200
    server mysql-b1 mysql-b1:3306
    server mysql-b2 mysql-b2:3306
    server mysql-b3 mysql-b3:3306
    server mysql-b4 mysql-b4:3306

frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
